[project]
name = "quantacrypt"
version = "1.3.0"
description = "Post-quantum file encryption using ML-KEM (Kyber-768) + AES-256-GCM with optional Shamir secret sharing"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
keywords = ["encryption", "post-quantum", "kyber", "shamir", "aes-gcm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # cryptography < 44 has two Dependabot-flagged CVEs:
    #   - GHSA-h4gh-qq45-vh27 (buffer overflow on non-contiguous buffers,
    #     fixed in 43.0.1)
    #   - GHSA-pq5q-pcp9-gmvx (incomplete DNS name-constraint enforcement
    #     on peer names, fixed in 42.0.4)
    # 44.0 covers both.
    "cryptography>=44.0",
    "argon2-cffi>=23.1",
    # Pinned to the major the code binds to, not the oldest that resolves.
    # kyber_encaps unpacks `Kyber768.encaps(pk)` as (shared_secret, ct); a
    # resolver landing on an older major with the opposite order would write
    # the shared secret into public metadata as kyber_kem_ct and produce a
    # file that looks entirely normal. CI is immune (--require-hashes), but
    # `pip install -e ".[dev]"` resolves fresh.
    "kyber-py>=1.0,<2",
    "shamirs>=4.0,<5",
    "mnemonic>=0.21",
]

[project.optional-dependencies]
dnd = ["tkinterdnd2-universal>=1.7"]
strength = ["zxcvbn>=4.4"]
volumes = ["fusepy>=3.0"]
# Pillow < 11.3 has the FITS GZIP decompression-bomb advisory (High,
# GHSA-gg2v-6j66-8q5j); the build only uses Pillow to encode icns
# slices, but the floor still has to cover the patched release.
build = ["pyinstaller>=6.10", "Pillow>=11.3"]
dev = [
    # pytest < 8.3.4 has GHSA-7g38-3x9v-v7vp (vulnerable tmpdir handling,
    # Moderate); Pygments < 2.15 has GHSA-mrwq-x4v8-fh7p (ReDoS on the
    # GUID regex, Low).  Pygments is pulled transitively by pytest's
    # error-formatting, but pin it explicitly so Dependabot can see the
    # floor directly.
    "pytest>=8.3.4",
    "pip-audit>=2.7",
    "pytest-cov>=4.0",
    # -n auto is the only lever left once the KDF cost is out of the way:
    # the suite is ~2,200 mostly-independent tests, each in its own tmp_path.
    # Passed on the command line, never in addopts, so a single-test run
    # stays serial and debuggable.
    "pytest-xdist>=3.6",
    # Thread method, not SIGALRM: this suite installs and tests its own
    # SIGTERM/SIGINT handlers, and the signal-based timeout would fight them.
    "pytest-timeout>=2.3",
    # Shuffles test order to surface order-dependence and shared-global-state
    # leaks — the root cause of "passes alone, fails in the suite". Reproduce
    # a bad order from the seed it prints: -p randomly --randomly-seed=<n>.
    "pytest-randomly>=3.15",
    "pygments>=2.15",
    # The lockfile check in CI resolves with the same uv as `uv lock` does
    # locally, and comes from the hash-pinned lock like every other tool
    # rather than whatever `pip install uv` serves that day.
    "uv>=0.5",
    # volumes (fusepy) must be in dev so CI's `pip install .[dev]` has it:
    # the release build imports it into the bundle, and the test suite
    # asserts the fuse.Operations subclass contract.
    "quantacrypt[dnd,strength,build,volumes]",
]

[project.urls]
Homepage = "https://github.com/alexboccard/QuantaCrypt"
Repository = "https://github.com/alexboccard/QuantaCrypt"
Issues = "https://github.com/alexboccard/QuantaCrypt/issues"

[project.scripts]
quantacrypt = "quantacrypt:main"
qc-core = "quantacrypt.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "real_argon2: run with the shipped Argon2id parameters instead of the cheap test ones",
    "gui: drives real Tk widgets — must run serially (the window server is shared state)",
    "needs_real_window: needs a focusable window, so test-window hiding is suspended for it",
]
addopts = "--cov=quantacrypt.core --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
# The whole package, not core/ alone: scoping the measurement to core/ meant
# the aggregate could read 95% while ui/volume_manager.py sat at 11% and
# __main__.py at 0%, because unmeasured files simply do not appear in the
# report.  scripts/check_coverage.py enforces the floor per file.
source = ["src/quantacrypt"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]
show_missing = true
skip_empty = true
fail_under = 95

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantacrypt = ["assets/*.png"]
