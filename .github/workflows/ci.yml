name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Release builds (release.yml) only run on v* tags — without this workflow,
# day-to-day pushes and Dependabot PRs land on master with zero automated
# testing and the 95% coverage gate is honor-system.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # fusepy imports only when a libfuse backend is loadable (it raises
      # OSError, not ImportError, without one) — install libfuse2 so the
      # FUSE contract tests run on CI instead of skipping.
      - name: Install libfuse
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2

      # Hash-pinned lock (uv.lock → requirements-lock.txt, all extras) so a
      # release is what was reviewed, not what PyPI serves that day.
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .

      # pip-audit itself comes from the hash-pinned lock (dev extra).
      - name: Audit dependencies for known advisories
        run: pip-audit -r requirements-lock.txt --strict --disable-pip

      # --cov-fail-under=95 explicitly, rather than trusting pytest-cov to
      # pick fail_under up from pyproject.toml — the gate must not hinge on
      # config-discovery behavior.
      - name: Run tests with coverage gate
        run: python -m pytest --tb=short -q --cov-fail-under=95

  # The native shell: the qc-core helper (PyInstaller, no Tk) plus the
  # SwiftUI app generated from macos/project.yml.  Runs on every push so a
  # protocol change that breaks the Swift client is caught before a tag.
  macos-shell:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Build qc-core helper (smoke-tested by the build script)
        run: python scripts/build.py --helper --skip-tests

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Build and test the app
        run: |
          cd macos
          xcodebuild -project QuantaCrypt.xcodeproj -scheme QuantaCrypt \
            -configuration Debug -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project QuantaCrypt.xcodeproj -scheme QuantaCrypt \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO test
