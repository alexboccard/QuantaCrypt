name: CodeQL

# Advanced setup, replacing default setup as of 2026-09-03.
#
# Default setup could never analyse Swift: its autobuilder looks for an Xcode
# project or a Swift package, and QuantaCrypt.xcodeproj is generated by
# xcodegen from project.yml and gitignored, so autobuild failed with
# "detected neither an Xcode project or workspace, nor a Swift package".
# Pinning the language list was not an option either — the stored config said
# actions+python and GitHub still detected Swift at run time.
#
# So Swift gets build-mode: manual and the same recipe CI's macos-shell job
# uses. actions and python need no build at all.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, matching the cadence default setup was configured with.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Everything the Swift build needs, done before init so only the
      # xcodebuild itself runs under the CodeQL tracer.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.build-mode == 'manual'
        with:
          python-version: "3.13"

      - name: Prepare the Xcode project
        if: matrix.build-mode == 'manual'
        run: |
          # Pillow, for the icon rendering below. Hash-pinned like every other
          # install in this repo, with the build backend from the lock too.
          python scripts/lock_subset.py setuptools > "$RUNNER_TEMP/build-requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/build-requirements.txt"
          pip install --no-build-isolation --require-hashes -r requirements-lock.txt
          # The .icns files are gitignored artifacts that project.yml lists as
          # resources, so xcodebuild fails at CpResource without them.
          python scripts/build.py --icons --skip-tests
          # XcodeGen pinned by release and SHA-256, not brew's tree of the day.
          bash scripts/install_xcodegen.sh
          export PATH="$HOME/.local/bin:$PATH"
          cd macos && xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # No qc-core helper here: the bundling script phase is tolerant of its
      # absence, and CodeQL only needs the Swift to compile.
      - name: Build the SwiftUI shell
        if: matrix.build-mode == 'manual'
        run: |
          cd macos
          xcodebuild -project QuantaCrypt.xcodeproj -scheme QuantaCrypt \
            -configuration Debug -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
